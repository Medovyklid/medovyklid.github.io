<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stránka nenalezena — MEDOVÝ KLID®</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0b1f16">
<link rel="icon" href="/web/img/icons/icon-192.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--forest:#0b1f16;--ivory:#f4efe5;--honey:#c9a227;--honey-soft:#e3c568;--sand:#ddd2bc;--serif:'Playfair Display',Georgia,serif;--sans:'Jost',-apple-system,'Segoe UI',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--forest);color:var(--ivory);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;line-height:1.7;font-weight:300}
.bee{font-size:3.4rem;margin-bottom:1rem}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,6vw,3.4rem);letter-spacing:2px}
p{color:#c9c1ad;max-width:460px;margin:1rem auto 2rem}
.btn{display:inline-block;background:var(--honey);color:var(--forest);padding:.9rem 2.2rem;border-radius:99px;text-decoration:none;font-weight:600;letter-spacing:1px;transition:.3s}
.btn:hover{background:var(--honey-soft);transform:translateY(-2px)}
.btn.ghost{background:none;border:1.5px solid var(--honey);color:var(--honey-soft);margin-left:.5rem}
.links{margin-top:2rem;font-size:.82rem;color:#8e988f}
.links a{color:var(--honey-soft);text-decoration:none;margin:0 .4rem}
</style>
</head>
<body>
  <div class="bee">🐝</div>
  <h1>404</h1>
  <p>Tato stránka v lese není. Možná se zatoulala do jiné lokality — vraťte se prosím na hlavní web.</p>
  <div>
    <a href="/web/" class="btn">Web pro hosty</a>
    <a href="/" class="btn ghost">Úvodní stránka</a>
  </div>
  <div class="links">
    <a href="/web/fransiza/">Franšíza</a> · <a href="/web/obchodni-podminky/">Obchodní podmínky</a> · <a href="/web/ochrana-osobnich-udaju/">Ochrana osobních údajů</a>
  </div>
</body>
</html>
